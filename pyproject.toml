[project]
name = "agentic-ai-vans"
version = "0.1.0"
description = "Vans Agent 課程學生完成版"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "charset-normalizer>=3.4.9",
    "clip",
    "gdown>=6.1.0",
    "langchain-openai>=1.3.3",
    "matplotlib>=3.11.1",
    "numpy>=2.5.1",
    "openai-tts",
    "opencv-python-headless>=5.0.0.93",
    "pandas>=3.0.3",
    "peas-agent-runtime",
    "peas-agent-tools",
    "pillow>=12.3.0",
    "plotly>=6.9.0",
    "python-dotenv>=1.0.0",
    "scikit-learn>=1.9.0",
    "streamlit>=1.61",
    "tensorflow-cpu>=2.21.0",
    "torchvision>=0.28.0",
    "ultralytics>=8.3.237",
    "xgboost>=3.3.0",
]

[tool.uv.sources]
peas-agent-tools = { git = "https://github.com/mz038197/peas-agent-tools.git", tag = "v0.1.1" }
clip = { git = "https://github.com/ultralytics/CLIP.git" }
openai-tts = { git = "https://github.com/mz038197/openai-tts.git" }
peas-agent-runtime = { path = "../peas-agent-runtime", editable = true }

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
