[project]
name = "agentic-ai-vans"
version = "0.1.0"
description = "Vans Agent 課程學生完成版"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "langchain-openai>=1.3.3",
    "peas-agent-runtime",
    "peas-agent-tools",
    "python-dotenv>=1.0.0",
]

[tool.uv.sources]
peas-agent-runtime = { git = "https://github.com/mz038197/peas-agent-runtime.git", tag = "v0.1.0" }
peas-agent-tools = { git = "https://github.com/mz038197/peas-agent-tools.git", tag = "v0.1.1" }

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
